name: Skill scripts

on:
  push:
    branches: [main]
    paths:
      - 'packages/skills-catalog/skills/**/scripts/**'
      - '.github/workflows/skill-scripts.yml'
  pull_request:
    paths:
      - 'packages/skills-catalog/skills/**/scripts/**'
      - '.github/workflows/skill-scripts.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: skill-scripts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  selftest:
    name: ${{ matrix.skill }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        skill: [tlc-spec-driven, tlc-spec-lean, tlc-plan, tlc-implement]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: selftest.py
        working-directory: packages/skills-catalog/skills/(development)/${{ matrix.skill }}/scripts
        run: python selftest.py
